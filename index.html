<script>

const SITE_NAME_URL =
"https://gist.githubusercontent.com/Secret-XYZ/75033c4ce48c23faca9b2fb03d371900/raw/18f9ba2cdc57f03876a06d6c5db1265791d449ab/Sitename";



async function loadSiteName(){


try{


let response =
await fetch(SITE_NAME_URL+"?"+Date.now());


let name =
await response.text();


name=name.trim();



document.title =
name;


document.querySelectorAll(".site-name")
.forEach(el=>{

el.textContent=name;

});


}

catch(e){

console.log(
"Ошибка загрузки названия"
);

}


}


loadSiteName();

</script>
