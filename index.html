<script>

const RAW = "https://gist.githubusercontent.com/Secret-XYZ/c7a66b9aa989a647e516b603dd368965/raw/dfce710be1949b54fd28d1eb2e2d401c221c6850/Information";


async function getArticles(){

const box = document.getElementById("articles");


try{


const response = await fetch(RAW + "?v=" + Date.now());


if(!response.ok){
throw new Error("Raw файл недоступен");
}


const text = await response.text();


console.log("RAW DATA:", text);



const blocks = text.split(/\n\s*\n/);


let articles = [];



blocks.forEach(block=>{


const title = block.match(/(?:\d+\-)?Заголовок:\s*(.+)/);

const subtitle = block.match(/Подзаголовок:\s*(.+)/);

const link = block.match(/Ссылка:\s*(.+)/);



if(title && subtitle && link){


articles.push({

title:title[1].trim(),

subtitle:subtitle[1].trim(),

link:link[1].trim()

});


}


});



articles.sort(
()=>Math.random()-0.5
);



let html = "";



articles.slice(0,6).forEach(article=>{


html += `

<div class="card">

<h3>
${article.title}
</h3>


<p>
${article.subtitle}
</p>


<a href="${article.link}">
Читать →
</a>


</div>

`;



});



if(html){

box.innerHTML = html;

}
else{

box.innerHTML =
"В Raw файле пока нет статей. Проверь формат.";

}



}

catch(error){


console.error(error);


box.innerHTML = 
`
<div class="card">

<h3>
Ошибка загрузки
</h3>

<p>
Не удалось получить статьи из Raw файла.
Проверь доступность Gist.
</p>

</div>
`;

}



}


getArticles();


</script>
